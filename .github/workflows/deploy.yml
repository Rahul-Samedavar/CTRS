name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main  # change if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "rahulsamedavar@gmail.com"
          git config --global user.name "Rahul-Samedavar"

          git clone https://user:$HF_TOKEN@huggingface.co/spaces/Rahul-Samedavar/CTRS space

          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            ./ space/

          cd space
          git add .
          git commit -m "Auto deploy from GitHub" || echo "No changes"
          git push